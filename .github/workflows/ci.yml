name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  engine:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install engine build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake clang libclang-dev build-essential ffmpeg

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target

      - name: Engine format check
        working-directory: engine
        run: cargo fmt --all -- --check

      - name: Engine tests
        working-directory: engine
        run: cargo test --all-targets

  build:
    name: Build (${{ matrix.os }})
    needs: [frontend, engine]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            engine_exe: digiclip.exe
          - os: ubuntu-latest
            engine_exe: digiclip
          - os: macos-latest
            engine_exe: digiclip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Tauri deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential curl wget file \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            cmake clang libclang-dev

      - name: Install macOS engine deps
        if: runner.os == 'macOS'
        run: brew install cmake llvm

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target

      - name: Install JS dependencies
        run: npm ci

      - name: Build engine (release)
        run: cargo build --release --manifest-path engine/Cargo.toml

      - name: Stage engine for bundling
        # The shell looks for resources/digiclip(.exe) beside its exe
        # (see src-tauri/src/main.rs `engine_binary`); tauri.conf bundles
        # the whole resources/ dir. Never committed (gitignored).
        shell: bash
        run: |
          cp "engine/target/release/${{ matrix.engine_exe }}" src-tauri/resources/
          ls -la src-tauri/resources/

      - name: Build app
        # TAURI_SIGNING_PRIVATE_KEY signs the updater bundles (.sig +
        # latest.json). Absent on fork PRs — those builds just go unsigned.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build

      - name: Upload installer artifact
        # No `**/*.app`: uploading the raw .app dir makes the release
        # step re-attach its loose contents (Info.plist, icon.icns, bare
        # binaries — seen live in v2.0.0). The .dmg already carries the app.
        # The .zip/.tar.gz/.sig set is the signed updater feed
        # (`createUpdaterArtifacts: v1Compatible` — only present when the
        # signing secret exists). latest.json is generated in release.
        uses: actions/upload-artifact@v4
        with:
          name: digiclip-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.zip
            src-tauri/target/release/bundle/**/*.tar.gz
            src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: digiclip-windows-latest
          path: artifacts/win

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: digiclip-ubuntu-latest
          path: artifacts/linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: digiclip-macos-latest
          path: artifacts/macos

      - name: Generate updater latest.json
        # Nothing in the toolchain writes latest.json — the v2 updater just
        # reads `{version, notes, pub_date, platforms: {target: {url,
        # signature}}}`. Each entry points at the signed v1Compatible
        # bundle for that target (zips/tarballs the updater knows how to
        # install), signature = the bundler's .sig contents. The updater
        # tries `{os}-{arch}-{installer}` then `{os}-{arch}`, so MSI users
        # match their key first and everyone else falls to the default.
        shell: bash
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          BASE="https://github.com/n1ssyyy/DigiClip/releases/download/${TAG}"
          sig() { tr -d '\n\r ' < "$1"; }
          NSIS_ZIP=$(basename artifacts/win/*.nsis.zip)
          MSI_ZIP=$(basename artifacts/win/*.msi.zip)
          APPIMAGE_TZ=$(basename artifacts/linux/*.AppImage.tar.gz)
          APP_TZ=$(basename artifacts/macos/*.app.tar.gz)
          echo "nsis: $NSIS_ZIP | msi: $MSI_ZIP | appimage: $APPIMAGE_TZ | app: $APP_TZ"
          jq -n \
            --arg ver "$VER" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg base "$BASE" \
            --arg nsis "$NSIS_ZIP" --arg nsis_sig "$(sig artifacts/win/*.nsis.zip.sig)" \
            --arg msi "$MSI_ZIP" --arg msi_sig "$(sig artifacts/win/*.msi.zip.sig)" \
            --arg appimage "$APPIMAGE_TZ" --arg appimage_sig "$(sig artifacts/linux/*.AppImage.tar.gz.sig)" \
            --arg app "$APP_TZ" --arg app_sig "$(sig artifacts/macos/*.app.tar.gz.sig)" \
            '{
              version: $ver,
              notes: ("See https://github.com/n1ssyyy/DigiClip/releases/tag/v\($ver) for what's new."),
              pub_date: $date,
              platforms: {
                "windows-x86_64-nsis": { url: "\($base)/\($nsis)", signature: $nsis_sig },
                "windows-x86_64-msi": { url: "\($base)/\($msi)", signature: $msi_sig },
                "windows-x86_64": { url: "\($base)/\($nsis)", signature: $nsis_sig },
                "linux-x86_64-appimage": { url: "\($base)/\($appimage)", signature: $appimage_sig },
                "linux-x86_64": { url: "\($base)/\($appimage)", signature: $appimage_sig },
                "darwin-aarch64": { url: "\($base)/\($app)", signature: $app_sig }
              }
            }' > dist/latest.json
          cat dist/latest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/win/**/*
            artifacts/linux/**/*
            artifacts/macos/**/*
            dist/latest.json
          generate_release_notes: true
          fail_on_unmatched_files: false
