name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            setup/package-lock.json

      - name: Build app frontend
        run: |
          npm ci
          npm run build

      - name: Build Setup frontend
        working-directory: setup
        run: |
          npm ci
          npm run build

  engine:
    name: Engine tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install engine build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake clang libclang-dev build-essential ffmpeg

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target

      - name: Engine format check
        working-directory: engine
        run: cargo fmt --all -- --check

      - name: Engine tests
        working-directory: engine
        run: cargo test --all-targets

  build:
    # One job per platform: engine → app → app payload → DigiClip Setup with
    # the payload embedded → a real install/launch/uninstall on the runner.
    # The only thing that leaves this job is the packed Setup.
    name: Build (${{ matrix.name }})
    needs: [frontend, engine]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            asset: DigiClip-Setup-Windows-x64.exe
          - name: Linux
            # Pinned: the glibc floor of every Linux binary follows the
            # runner (ONNX Runtime already needs >= 2.38, so 24.04 it is).
            os: ubuntu-24.04
            asset: DigiClip-Setup-Linux-x86_64.AppImage
          - name: macOS
            os: macos-latest
            asset: DigiClip-Setup-macOS-arm64.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential curl wget file \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            cmake clang libclang-dev libfuse2t64 xvfb xauth \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav \
            gstreamer1.0-gl gstreamer1.0-pulseaudio gstreamer1.0-alsa patchelf

      - name: Install macOS deps
        if: runner.os == 'macOS'
        run: brew install cmake llvm

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            setup/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> target
            src-tauri -> target
            setup/src-tauri -> target

      - name: Signing config
        # Only whether the secrets exist leaves this step; the secrets
        # themselves are handed to the signing steps alone (never to npm or
        # cargo). No secrets (forks, PR-less runs) = unsigned, as before.
        id: sign
        env:
          WIN_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          MAC_P12: ${{ secrets.APPLE_CERT_P12 }}
        run: |
          echo "win=$([ -n "$WIN_PFX" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "mac=$([ -n "$MAC_P12" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Import signing identity (macOS)
        if: runner.os == 'macOS' && steps.sign.outputs.mac == 'true'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/sign.keychain-db"
          pw=$(openssl rand -hex 16)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security import "$RUNNER_TEMP/sign.p12" -k "$kc" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/sign.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc"

      - name: Resolve version
        id: v
        run: |
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "app=$app" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$app" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match app version $app (src-tauri/tauri.conf.json)"
            exit 1
          fi

      - name: Install JS dependencies
        run: |
          npm ci
          (cd setup && npm ci)

      - name: Build engine
        # Run from engine/ so the engine's own .cargo config (if any) applies.
        working-directory: engine
        run: cargo build --release

      - name: Engine watchdog (unix)
        if: runner.os != 'Windows'
        run: engine/.github/scripts/watchdog-test.sh engine/target/release/digiclip

      - name: Engine watchdog (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: engine/.github/scripts/watchdog-test.ps1 -Engine engine/target/release/digiclip.exe

      - name: Stage engine into app resources
        # The shell finds resources/digiclip(.exe) under its resource dir;
        # tauri.conf bundles the whole resources/ dir. Never committed.
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp engine/target/release/digiclip.exe src-tauri/resources/
          else
            cp engine/target/release/digiclip src-tauri/resources/
            chmod +x src-tauri/resources/digiclip
          fi

      - name: Stage MSVC runtime beside the engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . .github/scripts/vc-runtime.ps1
          Copy-CrtFor src-tauri/resources/digiclip.exe src-tauri/resources

      - name: Build app
        run: |
          case "$RUNNER_OS" in
            Windows) npm run tauri build -- --no-bundle ;;
            macOS)   npm run tauri build -- --bundles app ;;
            Linux)   npm run tauri build -- --bundles appimage ;;
          esac

      - name: Sign app and engine (Windows)
        if: runner.os == 'Windows' && steps.sign.outputs.win == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: .github/scripts/sign-windows.ps1 -Files src-tauri/target/release/digiclip-app.exe, src-tauri/resources/digiclip.exe

      - name: Build app payload (Windows)
        # The app folder's *contents* (exe + resources\) at the zip root.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = 'payload/stage'
          New-Item -ItemType Directory -Force -Path "$stage/resources", payload | Out-Null
          Copy-Item src-tauri/target/release/digiclip-app.exe "$stage/"
          Copy-Item src-tauri/resources/* "$stage/resources/" -Exclude .gitkeep
          Compress-Archive -Path "$stage/*" -DestinationPath payload/app.zip -Force
          Get-ChildItem -Recurse $stage | Select-Object FullName, Length

      - name: Build app payload (macOS)
        # Developer ID + hardened runtime + notarized when the secrets are
        # set (the installed app then passes Gatekeeper on its own);
        # ad-hoc otherwise.
        if: runner.os == 'macOS'
        env:
          APPLE_SIGN_ID: ${{ steps.sign.outputs.mac == 'true' && secrets.APPLE_SIGN_ID || '' }}
          APPLE_ID: ${{ steps.sign.outputs.mac == 'true' && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ steps.sign.outputs.mac == 'true' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_APP_PASSWORD: ${{ steps.sign.outputs.mac == 'true' && secrets.APPLE_APP_PASSWORD || '' }}
        run: |
          app=src-tauri/target/release/bundle/macos/DigiClip.app
          .github/scripts/sign-macos.sh "$app"
          .github/scripts/notarize-macos.sh "$app"
          mkdir -p payload
          tar -czf payload/app.tar.gz -C "$(dirname "$app")" DigiClip.app
          ls -la payload/

      - name: Build app payload (Linux)
        if: runner.os == 'Linux'
        run: |
          appimage=$(ls src-tauri/target/release/bundle/appimage/*.AppImage)
          mkdir -p payload
          tar -czf payload/app.tar.gz -C "$(dirname "$appimage")" "$(basename "$appimage")"
          ls -la payload/

      - name: Build Setup
        working-directory: setup
        run: |
          case "$RUNNER_OS" in
            Windows) npm run tauri build -- --no-bundle ;;
            macOS)   npm run tauri build -- --bundles app ;;
            Linux)   npm run tauri build -- --bundles appimage ;;
          esac

      - name: Setup unit tests
        run: cargo test --release --manifest-path setup/src-tauri/Cargo.toml

      - name: Pack Setup (embed the app payload)
        env:
          V: ${{ steps.v.outputs.app }}
          ASSET: ${{ matrix.asset }}
          APPLE_SIGN_ID: ${{ steps.sign.outputs.mac == 'true' && secrets.APPLE_SIGN_ID || '' }}
          APPLE_ID: ${{ steps.sign.outputs.mac == 'true' && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ steps.sign.outputs.mac == 'true' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_APP_PASSWORD: ${{ steps.sign.outputs.mac == 'true' && secrets.APPLE_APP_PASSWORD || '' }}
        run: |
          mkdir -p dist
          case "$RUNNER_OS" in
            Windows)
              node setup/scripts/pack.mjs setup/src-tauri/target/release/digiclip-setup.exe payload/app.zip "$V" "dist/$ASSET"
              ;;
            Linux)
              node setup/scripts/pack.mjs "$(ls setup/src-tauri/target/release/bundle/appimage/*.AppImage)" payload/app.tar.gz "$V" "dist/$ASSET"
              chmod +x "dist/$ASSET"
              ;;
            macOS)
              # The payload sits in the bundle's Resources (appending to the
              # Mach-O would break its signature); then sign the whole
              # bundle so the seal covers payload.bin, and notarize it.
              app="setup/src-tauri/target/release/bundle/macos/DigiClip Setup.app"
              node setup/scripts/pack.mjs - payload/app.tar.gz "$V" "$app/Contents/Resources/payload.bin"
              .github/scripts/sign-macos.sh "$app"
              .github/scripts/notarize-macos.sh "$app"
              ditto -c -k --keepParent "$app" "dist/$ASSET"
              ;;
          esac
          ls -la dist/

      - name: Sign Setup (Windows)
        # After packing, so the signature covers the payload too; Setup
        # finds its trailer in front of the certificate table.
        if: runner.os == 'Windows' && steps.sign.outputs.win == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: .github/scripts/sign-windows.ps1 -Files "dist/${{ matrix.asset }}"

      - name: Signed Setup self-test (Windows)
        # Without the real certificate, sign a copy with a throwaway one so
        # every run proves a signed Setup still finds its payload.
        if: runner.os == 'Windows' && steps.sign.outputs.win != 'true'
        shell: pwsh
        run: |
          $copy = Join-Path $env:RUNNER_TEMP 'signed-setup.exe'
          Copy-Item "dist/${{ matrix.asset }}" $copy
          .github/scripts/sign-windows.ps1 -Files $copy -Throwaway
          $p = Start-Process -FilePath $copy -ArgumentList '--payload-info' -PassThru -NoNewWindow `
            -RedirectStandardOutput "$env:RUNNER_TEMP/info.txt"
          $null = $p.Handle
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Host '::error::signed Setup hung'; exit 1 }
          $info = (Get-Content "$env:RUNNER_TEMP/info.txt" -Raw).Trim()
          Write-Host "signed copy: $info (exit $($p.ExitCode))"
          if ($p.ExitCode -ne 0 -or $info.Split(' ')[0] -ne '${{ steps.v.outputs.app }}') {
            Write-Host "::error::a signed Setup lost its payload ('$info')"; exit 1
          }

      - name: Install smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/smoke-windows.ps1 -Setup "dist/${{ matrix.asset }}" -Version "${{ steps.v.outputs.app }}"

      - name: Install smoke test (Linux)
        if: runner.os == 'Linux'
        # Extract-and-run: the path users without FUSE take.
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: .github/scripts/smoke-unix.sh "dist/${{ matrix.asset }}" "${{ steps.v.outputs.app }}"

      - name: Install smoke test (macOS)
        # Test the shipped zip, not the build tree.
        if: runner.os == 'macOS'
        run: |
          t=$(mktemp -d)
          ditto -x -k "dist/${{ matrix.asset }}" "$t"
          .github/scripts/smoke-unix.sh "$t/DigiClip Setup.app/Contents/MacOS/digiclip-setup" "${{ steps.v.outputs.app }}"

      - name: Upload Setup
        uses: actions/upload-artifact@v4
        with:
          name: digiclip-setup-${{ matrix.name }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14

  release:
    # The release carries exactly the three DigiClip Setup installers —
    # nothing else. The app's update check reads the release via the GitHub
    # API and downloads the Setup for its platform.
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: digiclip-setup-*
          merge-multiple: true
          path: dist

      - name: Check release surface
        run: |
          ls -la dist/
          expected="DigiClip-Setup-Linux-x86_64.AppImage DigiClip-Setup-Windows-x64.exe DigiClip-Setup-macOS-arm64.zip"
          actual=$(ls dist | LC_ALL=C sort | xargs)
          if [ "$actual" != "$expected" ]; then
            echo "::error::release must contain exactly the three Setup installers, got: $actual"
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Install

            Download the DigiClip Setup for your system and run it. The app is inside the installer, so no internet connection is needed while installing. Run the same Setup again later to update, repair or uninstall.

            | System | Download | Notes |
            |---|---|---|
            | Windows 10/11 (x64) | `DigiClip-Setup-Windows-x64.exe` | Not code-signed yet: on the SmartScreen prompt choose **More info → Run anyway**. |
            | macOS (Apple Silicon) | `DigiClip-Setup-macOS-arm64.zip` | Unzip, then open **DigiClip Setup**. It isn't notarized yet: if macOS blocks it, go to **System Settings → Privacy & Security → Open Anyway**. |
            | Linux (x86_64, glibc 2.39+: Ubuntu 24.04+, Fedora 40+, Debian 13+) | `DigiClip-Setup-Linux-x86_64.AppImage` | `chmod +x DigiClip-Setup-Linux-x86_64.AppImage && ./DigiClip-Setup-Linux-x86_64.AppImage`. If it won't start (no FUSE), add `--appimage-extract-and-run`. |
