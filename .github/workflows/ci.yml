name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  engine:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install engine build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake clang libclang-dev build-essential ffmpeg

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target

      - name: Engine format check
        working-directory: engine
        run: cargo fmt --all -- --check

      - name: Engine tests
        working-directory: engine
        run: cargo test --all-targets

  build:
    name: Build (${{ matrix.os }})
    needs: [frontend, engine]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            engine_exe: digiclip.exe
          - os: ubuntu-latest
            engine_exe: digiclip
          - os: macos-latest
            engine_exe: digiclip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Tauri deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential curl wget file \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            cmake clang libclang-dev

      - name: Install macOS engine deps
        if: runner.os == 'macOS'
        run: brew install cmake llvm

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target

      - name: Install JS dependencies
        run: npm ci

      - name: Build engine (release)
        run: cargo build --release --manifest-path engine/Cargo.toml

      - name: Build setup wizard (all platforms)
        # The custom installer is bundled into the app's resources so the
        # in-app "Update" handoff always has it locally. Windows/Linux
        # ship the raw binary; macOS gets a real .app bundle.
        working-directory: setup
        run: |
          npm ci
          if [ "${{ runner.os }}" = "macOS" ]; then
            npm run tauri build -- --bundles app
          else
            npm run tauri build -- --no-bundle
          fi

      - name: Stage engine + setup for bundling
        # The shell looks for resources/digiclip(.exe) and
        # resources/DigiClip-Setup beside its exe; tauri.conf bundles
        # the whole resources/ dir. Never committed (gitignored).
        shell: bash
        run: |
          cp "engine/target/release/${{ matrix.engine_exe }}" src-tauri/resources/
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp setup/src-tauri/target/release/digiclip-setup.exe src-tauri/resources/DigiClip-Setup.exe
          else
            cp setup/src-tauri/target/release/digiclip-setup src-tauri/resources/DigiClip-Setup
            chmod +x src-tauri/resources/DigiClip-Setup
          fi
          ls -la src-tauri/resources/

      - name: Build app
        run: npm run tauri build

      - name: Build Windows app payload
        # The custom Setup consumes a raw app payload (app exe + resources/)
        # — zipped here, consumed by the wizard.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $stage = "payload/DigiClip"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item src-tauri/target/release/digiclip-app.exe "$stage/"
          Copy-Item -Recurse src-tauri/resources "$stage/resources"
          $zip = "payload/DigiClip_${version}_win-x64-app.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "payload/DigiClip" -DestinationPath $zip
          Get-ChildItem $zip | Select-Object Name, Length

      - name: Build macOS app payload
        # The .app bundle itself (the dmg stays as a convenience download).
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")
          mkdir -p payload
          tar -czf "payload/DigiClip_${version}_mac-arm64-app.tar.gz" -C src-tauri/target/release/bundle/macos DigiClip.app
          ls -la payload/

      - name: Build Linux app payload
        # The AppImage itself (the deb stays as a convenience download).
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version=$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")
          mkdir -p payload
          appimage=$(ls src-tauri/target/release/bundle/appimage/*.AppImage)
          tar -czf "payload/DigiClip_${version}_linux-x86_64-app.tar.gz" -C "$(dirname "$appimage")" "$(basename "$appimage")"
          ls -la payload/

      - name: Stage setup for release
        # The standalone download people click on the releases page.
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp setup/src-tauri/target/release/digiclip-setup.exe dist/DigiClip-Setup.exe
          elif [ "${{ runner.os }}" = "macOS" ]; then
            (cd setup/src-tauri/target/release/bundle/macos && zip -qry "$GITHUB_WORKSPACE/dist/DigiClip-Setup-macOS.zip" DigiClip-Setup.app)
          else
            cp setup/src-tauri/target/release/digiclip-setup dist/DigiClip-Setup-linux-x86_64
            chmod +x dist/DigiClip-Setup-linux-x86_64
          fi
          ls -la dist/

      - name: Upload installer artifact
        # The release surface is intentionally small: one custom Setup per
        # platform, its app payload, plus the native packages people expect
        # (AppImage/deb/dmg). No NSIS/MSI/RPM internals, no sig bundles.
        uses: actions/upload-artifact@v4
        with:
          name: digiclip-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.dmg
            payload/DigiClip_*_app.zip
            payload/DigiClip_*_app.tar.gz
            dist/DigiClip-Setup*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: digiclip-windows-latest
          path: artifacts/win

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: digiclip-ubuntu-latest
          path: artifacts/linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: digiclip-macos-latest
          path: artifacts/macos

      - name: Generate latest.json
        # The app's update check reads {version, notes, pub_date} and
        # hands the actual install to DigiClip Setup, so the feed is just
        # the version pointer — no platform map, no signatures.
        shell: bash
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          jq -n \
            --arg ver "$VER" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              version: $ver,
              notes: ("Release notes: https://github.com/n1ssyyy/DigiClip/releases/tag/v\($ver)"),
              pub_date: $date
            }' > dist/latest.json
          cat dist/latest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/win/**/*
            artifacts/linux/**/*
            artifacts/macos/**/*
            dist/latest.json
          generate_release_notes: true
          fail_on_unmatched_files: false
