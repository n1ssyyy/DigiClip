name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: DigiClip

jobs:
  test:
    name: Test (PHP + JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, curl, dom, fileinfo, mbstring, openssl, pdo, pdo_sqlite, sqlite3, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install JS dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          mkdir -p database
          touch database/database.sqlite
          php artisan migrate --force

      - name: Build assets
        run: npm run build

      - name: Run tests
        run: php artisan test

  build:
    name: Build (${{ matrix.target }})
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libasound2t64 \
            libxtst6 \
            xvfb

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, fileinfo, pdo_sqlite, sqlite3, zip, gd
          tools: composer:v2
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install JS dependencies
        run: npm ci

      - name: Install Electron dependencies
        working-directory: nativephp/electron
        run: npm ci

      - name: Rebuild stale electron-plugin dist (upstream workaround)
        working-directory: nativephp/electron
        run: npm run plugin:build

      - name: Prepare environment
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          mkdir -p database
          touch database/database.sqlite
          php artisan migrate --force

      - name: Build frontend assets
        run: npm run build

      - name: Fetch bundled STT model (base.en, ships in the installer)
        # 142MB — over GitHub's 100MB file cap, so it is NOT committed.
        # Staged under resources/models/, copied into the build by
        # native:build, seeded to user storage on first boot.
        shell: bash
        run: |
          mkdir -p resources/models
          curl -sfL -o resources/models/ggml-base.en.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin
          ls -la resources/models/

      - name: Build Vulkan whisper-cli (linux-x64 sidecar)
        # GPU transcription needs a Vulkan-enabled whisper-cli. The repo
        # carries a prebuilt linux-x64 binary, but CI rebuilds it from the
        # pinned whisper.cpp commit so installers never go stale silently.
        # Needs: Vulkan headers/loader + glslc (via glslang-tools or the
        # Vulkan SDK's /usr/local/bin/glslc). Ubuntu's glslang-tools alone
        # may miss FindVulkan's glslc check, so add it explicitly if present.
        if: matrix.target == 'linux'
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libvulkan-dev glslang-tools cmake g++
          if [ -f /usr/local/bin/glslc ] && [ ! -x /usr/bin/glslc ]; then
            sudo ln -s /usr/local/bin/glslc /usr/bin/glslc
          fi
          glslc --version
          git clone https://github.com/ggerganov/whisper.cpp /tmp/whisper.cpp
          git -C /tmp/whisper.cpp checkout 927cfce34f31707e17f2bff35c349632fb9e2c3a
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build \
            -DGGML_VULKAN=1 -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/whisper.cpp/build -j$(nproc) --target whisper-cli --config Release
          cp /tmp/whisper.cpp/build/bin/whisper-cli resources/bin/linux-x64/whisper-cli-vulkan
          chmod 755 resources/bin/linux-x64/whisper-cli-vulkan
          ./resources/bin/linux-x64/whisper-cli-vulkan --version
          ls -la resources/bin/linux-x64/

      - name: Build Windows media binaries (ffmpeg + whisper CPU/Vulkan)
        # win-x64/ is empty in git (binaries are platform-built). Fetch
        # ffmpeg from gyan.dev, compile whisper.cpp (CPU + Vulkan sidecar)
        # from the same pinned commit as the linux sidecar. Vulkan borrows
        # the runner's Vulkan SDK when present; when absent, the Windows
        # installer still ships a CPU-only whisper-cli and GPU toggle stays
        # disabled with a clear Health/Settings reason (no build break).
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hasVulkan = $false
          if ($env:VULKAN_SDK -and (Test-Path "$env:VULKAN_SDK\Bin\glslc.exe")) {
            "$env:VULKAN_SDK\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            glslc --version
            $hasVulkan = $true
          } elseif (Get-Command glslc -ErrorAction SilentlyContinue) {
            glslc --version
            $hasVulkan = $true
          } else {
            Write-Host '::warning::Vulkan SDK / glslc not found — win-x64 GPU sidecar will be skipped (CPU only)'
          }
          git clone https://github.com/ggerganov/whisper.cpp C:\whisper.cpp
          git -C C:\whisper.cpp checkout 927cfce34f31707e17f2bff35c349632fb9e2c3a
          cmake -S C:\whisper.cpp -B C:\whisper-cpu -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build C:\whisper-cpu --target whisper-cli --config Release -j $env:NUMBER_OF_PROCESSORS
          Copy-Item C:\whisper-cpu\bin\Release\whisper-cli.exe resources\bin\win-x64\whisper-cli.exe
          if ($hasVulkan) {
            cmake -S C:\whisper.cpp -B C:\whisper-vk -DGGML_VULKAN=1 -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
            cmake --build C:\whisper-vk --target whisper-cli --config Release -j $env:NUMBER_OF_PROCESSORS
            Copy-Item C:\whisper-vk\bin\Release\whisper-cli.exe resources\bin\win-x64\whisper-cli-vulkan.exe
          } else {
            Write-Host 'Skipping whisper-cli-vulkan.exe (no Vulkan)'
          }
          curl.exe -sfL -o $env:TEMP\ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          Expand-Archive $env:TEMP\ffmpeg.zip -DestinationPath $env:TEMP\ffzip
          Copy-Item "$env:TEMP\ffzip\ffmpeg-*-essentials_build\bin\ffmpeg.exe" resources\bin\win-x64\ffmpeg.exe
          Copy-Item "$env:TEMP\ffzip\ffmpeg-*-essentials_build\bin\ffprobe.exe" resources\bin\win-x64\ffprobe.exe
          Get-ChildItem resources\bin\win-x64\
          .\resources\bin\win-x64\whisper-cli.exe --version

      - name: Build ${{ matrix.target }} installer
        # NativePHP emits installers to nativephp/electron/dist (not ./build).
        # Pin arch=x64: the default linux target also builds arm64 and the
        # two AppImages share one filename (arm64 would clobber x64).
        run: php artisan native:build ${{ matrix.target }} x64 --no-interaction

      - name: List build output
        shell: bash
        run: |
          ls -la nativephp/electron/dist 2>/dev/null || true

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: digiclip-${{ matrix.target }}
          path: |
            nativephp/electron/dist/*.AppImage
            nativephp/electron/dist/*.deb
            nativephp/electron/dist/*.exe
            nativephp/electron/dist/*.msi
            nativephp/electron/dist/*.zip
            nativephp/electron/dist/*.yml
            nativephp/electron/dist/*.blockmap
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: digiclip-linux
          path: artifacts/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: digiclip-win
          path: artifacts/win

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux/**/*
            artifacts/win/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
