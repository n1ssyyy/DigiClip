<!doctype html>
<!-- GitHub Pages only forwards to the real homepage, which lives on Vercel
     (site/). The workflow in .github/workflows/pages.yml replaces
     __SITE_URL__ with the repository variable SITE_URL when it deploys. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DigiClip</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="__SITE_URL__">
<meta http-equiv="refresh" content="0; url=__SITE_URL__">
<script>location.replace('__SITE_URL__' + location.search + location.hash);</script>
<style>
  html { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: hsl(0 0% 7%);
    color: hsl(0 0% 64%);
    font: 14px/1.6 ui-monospace, 'Cascadia Mono', Consolas, monospace;
    text-align: center;
  }
  a { color: hsl(0 0% 93%); }
</style>
</head>
<body>
<p>DigiClip has moved. <a href="__SITE_URL__">Open the DigiClip homepage</a></p>
</body>
</html>
