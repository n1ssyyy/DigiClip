<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>DigiClip share image</title>
<!-- The picture link previews show (site/og.png, 1200x630): the logo and
     the homepage headline, in the homepage's own type and colours.
     Rebuild it from the repo root with Chrome or Edge:

     chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 \
       --window-size=1200,630 --virtual-time-budget=4000 \
       --screenshot=site/og.png scripts/site-og.html -->
<style>
    @font-face {
        font-family: 'Anton';
        src: url('../site/fonts/Anton-Regular.ttf') format('truetype');
    }
    @font-face {
        font-family: 'JetBrains Mono';
        src: url('../site/fonts/JetBrainsMono-Variable.ttf') format('truetype');
        font-weight: 100 800;
    }
    html,
    body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: hsl(0 0% 7%);
        color: hsl(0 0% 93%);
        font-family: 'JetBrains Mono', monospace;
        -webkit-font-smoothing: antialiased;
    }
    .card {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 630px;
        padding: 52px 64px 56px;
    }
    .brand {
        display: flex;
        align-items: center;
        gap: 22px;
        font-size: 38px;
        font-weight: 700;
        letter-spacing: -0.01em;
    }
    .brand img {
        width: 96px;
        height: 96px;
    }
    h1 {
        margin: 0 0 0 -0.02em;
        font-family: 'Anton', sans-serif;
        font-size: 150px;
        font-weight: 400;
        line-height: 1;
        letter-spacing: 0.002em;
        text-transform: uppercase;
    }
    h1 span {
        display: block;
        white-space: nowrap;
    }
    /* The spoken word, as on the page: inverted on a white slab. */
    h1 b {
        position: relative;
        display: inline-block;
        z-index: 0;
        font-weight: 400;
        color: hsl(0 0% 7%);
    }
    h1 b::before {
        content: '';
        position: absolute;
        inset: 0.015em -0.05em -0.022em;
        z-index: -1;
        border-radius: 0.03em;
        background: #fff;
    }
    p {
        margin: 0;
        font-size: 26px;
        color: hsl(0 0% 64%);
    }
    p strong {
        font-weight: 700;
        color: hsl(0 0% 93%);
    }
</style>
<div class="card">
    <div class="brand"><img src="../src-tauri/icons/icon.png" alt="">DigiClip</div>
    <h1><span>Stop renting</span><span>your <b>clips.</b></span></h1>
    <p>The free AI clipper that runs on your machine. <strong>No upload.</strong></p>
</div>
</html>
