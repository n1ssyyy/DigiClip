[package]
name = "digiclip-setup"
version = "1.1.0"
description = "DigiClip Setup: custom offline installer wizard (detect, install, update, repair, uninstall)."
authors = ["n1ssyyy"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"

# Registry reads/writes are Windows-only (Add/Remove Programs entry).
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
