[package]
name = "digiclip-app"
version = "2.3.4"
description = "DigiClip desktop shell (Tauri): spawns the digiclip serve sidecar and hosts the React UI."
authors = ["n1ssyyy"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0.104"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"

# Linux: hook WebKitGTK's web-process-terminated signal (same version wry uses).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
